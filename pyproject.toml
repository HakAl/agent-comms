[project]
name = "agent-comms"
version = "0.2.0.dev0"
description = "Local architect communication relay for multi-agent terminal workflows."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0,<2"]
# Exact pin, not a floor: an unbounded spec resolves per-interpreter, and
# mcp 2.0.0 dropped mcp.server.fastmcp. Bump only with a green suite.
test = ["mcp[cli]==1.27.1"]

[project.scripts]
agent-comms = "agent_comms.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_comms*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
