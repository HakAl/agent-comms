[project]
name = "agent-comms"
version = "0.1.0"
description = "Local architect communication relay for multi-agent terminal workflows."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0"]

[project.scripts]
agent-comms = "agent_comms.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_comms*"]
